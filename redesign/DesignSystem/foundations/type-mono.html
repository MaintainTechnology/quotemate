<!-- @dsCard group="Type" viewport="700x210" name="Mono — JetBrains Mono" subtitle="Eyebrows, labels, prices, metadata — uppercase, wide tracking" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px 28px; background: var(--ink-deep); display: grid; gap: 16px; }
  .eyebrow { font-family: var(--font-mono); font-size: 12px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.18em; color: var(--text-dim); }
  .label { font-family: var(--font-mono); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; color: var(--accent); }
  .price { font-family: var(--font-mono); font-weight: 700; font-size: 38px; letter-spacing: -0.01em; color: var(--accent); font-variant-numeric: tabular-nums; }
  .price small { color: var(--text-dim); font-size: 13px; font-weight: 600; letter-spacing: 0.12em; }
  .meta { font-family: var(--font-mono); font-size: 12px; color: var(--text-sec); letter-spacing: 0.06em; }
  .note { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.12em; }
</style>
</head>
<body>
  <div class="eyebrow">How it works · 0.18em</div>
  <div class="label">Live example · SMS intake</div>
  <div class="price">$890 <small>INC GST</small></div>
  <div class="meta">QUOTE REF · 7F3A9C21 · Issued 24 Jun 2026</div>
  <div class="note">JetBrains Mono · 400–700 · tabular-nums for figures</div>
</body>
</html>
