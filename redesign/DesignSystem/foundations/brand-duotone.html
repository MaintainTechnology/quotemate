<!-- @dsCard group="Brand" viewport="700x230" name="Duotone photography" subtitle="Stock trade photos warmed toward the palette — friendly, real, native to the brand" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 24px 28px; background: var(--ink-deep); display: flex; gap: 16px; }
  figure { margin: 0; position: relative; flex: 1 1 0; height: 178px; border: 1px solid var(--ink-line); box-shadow: var(--lift); }
  .raw img { filter: none; }
  figcaption { position: absolute; inset-inline: 0; bottom: 0; padding: 22px 12px 9px; font-family: var(--font-mono); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.14em; }
  .note { align-self: center; max-width: 180px; }
  .note h3 { margin: 0 0 6px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); }
  .note p { margin: 0; font-size: 12.5px; line-height: 1.5; color: var(--text-sec); }
</style>
</head>
<body>
  <figure class="raw qm-duotone">
    <img class="qm-duotone__img" src="../assets/photos/trade-electrical.jpg" alt="" style="filter:none">
    <figcaption class="qm-photo-caption">Raw stock</figcaption>
  </figure>
  <figure class="qm-duotone">
    <img class="qm-duotone__img" src="../assets/photos/trade-electrical.jpg" alt="Australian electrician at a power box">
    <figcaption class="qm-photo-caption">Duotone · brand-tinted</figcaption>
  </figure>
  <div class="note">
    <h3>Treatment</h3>
    <p>Desaturate + warm, multiply scrim to charcoal shadows, soft-light lift toward yellow. Captions sit on a dark gradient for AA contrast.</p>
  </div>
</body>
</html>
