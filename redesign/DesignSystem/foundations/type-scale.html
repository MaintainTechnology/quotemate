<!-- @dsCard group="Type" viewport="700x300" name="Type scale" subtitle="Manrope size ramp — body 16px up to fluid hero" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 28px; background: var(--ink-deep); }
  .r { display: flex; align-items: baseline; gap: 18px; border-bottom: 1px solid var(--ink-line); padding: 9px 0; }
  .r:last-child { border-bottom: 0; }
  .s { font-family: var(--font-sans); font-weight: 800; color: var(--text-pri); text-transform: uppercase; letter-spacing: -0.03em; line-height: 1; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .t { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; white-space: nowrap; }
</style>
</head>
<body>
  <div class="r"><span class="s" style="font-size:46px">Aa Hero</span><span class="t">--text-7xl · 72/clamp</span></div>
  <div class="r"><span class="s" style="font-size:34px">Aa Section</span><span class="t">--text-5xl · 48</span></div>
  <div class="r"><span class="s" style="font-size:24px">Aa Sub-head</span><span class="t">--text-2xl · 24</span></div>
  <div class="r"><span class="s" style="font-size:20px">Aa Card title</span><span class="t">--text-xl · 20</span></div>
  <div class="r"><span class="s" style="font-size:16px; text-transform:none; letter-spacing:0; font-weight:500; color:var(--text-sec)">Aa Body — sentence case</span><span class="t">--text-base · 16</span></div>
  <div class="r"><span class="s" style="font-size:12px; font-family:var(--font-mono); letter-spacing:0.14em; color:var(--text-dim)">Aa Mono label</span><span class="t">--text-xs · 12</span></div>
</body>
</html>
