<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 30px 0; background: var(--ink-deep); display: grid; align-content: center; }
  .qm-marquee { padding: 18px 0; }
  .item { display: flex; align-items: center; font-family: var(--font-mono); font-size: 20px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.14em; }
  .item .seg { padding: 0 24px; }
</style>
</head>
<body>
  <div class="qm-marquee">
    <div class="qm-marquee__track">
      <span class="item">
        <span class="seg">QuoteMax</span><span>·</span><span class="seg">Built in Australia</span><span>·</span><span class="seg">For tradies, by tradies</span><span>·</span><span class="seg">Quote drafted in under a minute</span><span>·</span>
      </span>
      <span class="item" aria-hidden="true">
        <span class="seg">QuoteMax</span><span>·</span><span class="seg">Built in Australia</span><span>·</span><span class="seg">For tradies, by tradies</span><span>·</span><span class="seg">Quote drafted in under a minute</span><span>·</span>
      </span>
    </div>
  </div>
</body>
</html>
