<!-- @dsCard group="Brand" viewport="700x220" name="Logo mark" subtitle="Speech-bubble + tick on a Caterpillar-yellow tile — favicon to nav, one shape at every size" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 26px 28px; background: var(--ink-deep); display: flex; align-items: center; gap: 30px; }
  .marks { display: flex; align-items: flex-end; gap: 22px; }
  .marks img { display: block; }
  .lab { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 9px; text-align: center; }
  .note { border-left: 2px solid var(--accent); padding-left: 16px; max-width: 230px; }
  .note h3 { margin: 0 0 6px; font-family: var(--font-mono); font-size: 11px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.12em; color: var(--accent); }
  .note p { margin: 0; font-size: 13px; line-height: 1.55; color: var(--text-sec); }
</style>
</head>
<body>
  <div class="marks">
    <div><img src="../assets/logos/quotemax-mark.svg" width="88" height="88" alt="QuoteMax mark"><div class="lab">88px</div></div>
    <div><img src="../assets/logos/quotemax-mark.svg" width="48" height="48" alt="QuoteMax mark"><div class="lab">48px</div></div>
    <div><img src="../assets/logos/quotemax-mark.svg" width="28" height="28" alt="QuoteMax mark"><div class="lab">28px</div></div>
  </div>
  <div class="note">
    <h3>The mark</h3>
    <p>A dark speech bubble with a tail and a tick, on a yellow tile. Quotes by text, approves the job. Clearspace = the tick's height on all sides.</p>
  </div>
</body>
</html>
