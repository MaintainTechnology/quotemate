<!-- @dsCard group="Colors" viewport="700x190" name="State colours" subtitle="Used sparingly — a chip or a rule, never a large fill" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 22px 24px; background: var(--ink-deep); }
  .row { display: flex; gap: 14px; flex-wrap: wrap; }
  .sw { flex: 1 1 0; min-width: 120px; }
  .chip { height: 56px; border: 1px solid var(--ink-line); display: grid; place-items: center; }
  .chip span { font-family: var(--font-mono); font-size: 11px; font-weight: 700; text-transform: uppercase; letter-spacing: 0.1em; color: #fff; }
  .name { font-family: var(--font-mono); font-size: 12px; font-weight: 600; color: var(--text-pri); margin-top: 9px; }
  .hex { font-family: var(--font-mono); font-size: 11px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.1em; margin-top: 3px; }
  .bright { font-family: var(--font-mono); font-size: 11px; margin-top: 4px; }
</style>
</head>
<body>
  <div class="row">
    <div class="sw">
      <div class="chip" style="background: var(--success)"><span>Paid · success</span></div>
      <div class="name">--success</div><div class="hex">#15803D</div>
      <div class="bright" style="color: var(--success-bright)">▍ --success-bright text</div>
    </div>
    <div class="sw">
      <div class="chip" style="background: var(--warning)"><span>Review · warning</span></div>
      <div class="name">--warning</div><div class="hex">#B45309</div>
      <div class="bright" style="color: var(--warning-bright)">▍ --warning-bright text</div>
    </div>
    <div class="sw">
      <div class="chip" style="background: var(--danger)"><span>Error · danger</span></div>
      <div class="name">--danger</div><div class="hex">#B91C1C</div>
      <div class="bright" style="color: var(--danger-bright)">▍ --danger-bright text</div>
    </div>
  </div>
</body>
</html>
