<!-- @dsCard group="Brand" viewport="700x200" name="Wordmark & lockup" subtitle="Mark + QUOTEMAX in Manrope 800 — one colour in the current brand" -->
<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../styles.css">
<style>
  body { margin: 0; padding: 28px; background: var(--ink-deep); display: grid; gap: 22px; }
  .lockup { display: flex; align-items: center; gap: 12px; }
  .lockup img { display: block; }
  .wm { font-family: var(--font-sans); font-weight: 800; text-transform: uppercase; letter-spacing: -0.02em; color: var(--text-pri); font-size: 30px; line-height: 1; }
  .rule { height: 1px; background: var(--ink-line); }
  .alt { display: flex; align-items: center; gap: 30px; }
  .alt .wm { font-size: 22px; }
  .cap { font-family: var(--font-mono); font-size: 10px; color: var(--text-dim); text-transform: uppercase; letter-spacing: 0.12em; }
</style>
</head>
<body>
  <div class="lockup">
    <img src="../assets/logos/quotemax-mark.svg" width="46" height="46" alt="">
    <span class="wm">QuoteMax</span>
  </div>
  <div class="rule"></div>
  <div class="alt">
    <span class="wm">QUOTEMAX</span>
    <span class="cap">Wordmark · Manrope 800 · -0.02em · --text-pri</span>
  </div>
</body>
</html>
