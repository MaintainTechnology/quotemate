<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 26px 28px; background: var(--ink-deep); }
  .group { margin-bottom: 22px; }
  .group:last-child { margin-bottom: 0; }
  .glabel { font-family: var(--font-mono); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.16em; color: var(--text-dim); margin-bottom: 12px; border-bottom: 1px solid var(--ink-line); padding-bottom: 7px; }
  .row { display: flex; flex-wrap: wrap; gap: 12px; align-items: center; }
  .stats { display: flex; gap: 40px; flex-wrap: wrap; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const { Button, Eyebrow, Badge, StatusPill, Stat, Avatar } = window.QuoteMaxDesignSystem_638aa1;
    const flag = <img src="../../assets/icons/au-flag.svg" alt="Australia" style={{ height: 12, border: '1px solid rgba(255,255,255,0.12)', display: 'block' }} />;

    function Demo() {
      return (
        <div>
          <div className="group">
            <div className="glabel">Button — variants · sizes · arrow · disabled</div>
            <div className="row">
              <Button variant="primary" withArrow>Get my QuoteMax</Button>
              <Button variant="secondary">See how it works</Button>
              <Button variant="ghost">Cancel</Button>
              <Button variant="danger" size="sm">Delete</Button>
              <Button variant="primary" disabled>Disabled</Button>
            </div>
            <div className="row" style={{ marginTop: 12 }}>
              <Button variant="primary" size="sm">Small</Button>
              <Button variant="primary" size="md">Medium</Button>
              <Button variant="primary" size="lg" withArrow>Large hero CTA</Button>
            </div>
          </div>

          <div className="group">
            <div className="glabel">Badge & StatusPill</div>
            <div className="row">
              <Badge icon={flag}>Built for Australian tradies</Badge>
              <Badge tone="accent">Electrical pilot · NSW</Badge>
              <Badge tone="solid">Most popular</Badge>
              <StatusPill tone="live" pulse>Account active</StatusPill>
              <StatusPill tone="review">Awaiting review</StatusPill>
              <StatusPill tone="paid">Deposit paid</StatusPill>
            </div>
          </div>

          <div className="group">
            <div className="glabel">Avatar &amp; Eyebrow</div>
            <div className="row">
              <Avatar name="Dave Nguyen" />
              <Avatar name="Sparky Co" tone="ink" />
              <Avatar name="JM" round size={48} />
              <div style={{ marginLeft: 8 }}><Eyebrow>How it works</Eyebrow></div>
            </div>
          </div>

          <div className="group">
            <div className="glabel">Stat band</div>
            <div className="stats">
              <Stat value="< 1 min" label="Per quote drafted" />
              <Stat value="24/7" label="Line always answered" />
              <Stat value="$0" label="Cut of your jobs" />
              <Stat value="$99" label="Locked site visit" />
            </div>
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
