<!doctype html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="stylesheet" href="../../styles.css">
<style>
  body { margin: 0; padding: 26px 28px; background: var(--ink-deep); }
  .glabel { font-family: var(--font-mono); font-size: 10px; font-weight: 600; text-transform: uppercase; letter-spacing: 0.16em; color: var(--text-dim); margin: 0 0 12px; border-bottom: 1px solid var(--ink-line); padding-bottom: 7px; }
  .cols { display: grid; grid-template-columns: 1.2fr 1fr; gap: 22px; align-items: start; }
  .tiers { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 12px; }
  @media (max-width: 620px) { .cols { grid-template-columns: 1fr; } }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script src="../../_ds_bundle.js"></script>
</head>
<body>
  <div id="root"></div>
  <script type="text/babel" data-presets="react">
    const { TierCard, SmsThread } = window.QuoteMaxDesignSystem_638aa1;
    function Demo() {
      return (
        <div className="cols">
          <div>
            <div className="glabel">TierCard — Good / Better / Best</div>
            <div className="tiers">
              <TierCard tier="Good" priceIncGst={640} depositAmount={192} blurb="The essentials, done right." />
              <TierCard tier="Better" recommended priceIncGst={890} depositAmount={267} blurb="Recommended balance." />
              <TierCard tier="Best" priceIncGst={1180} depositAmount={354} blurb="Premium fittings." />
            </div>
          </div>
          <div>
            <div className="glabel">SmsThread</div>
            <SmsThread
              messages={[
                { from: 'customer', text: "Hey mate, need 6 downlights in the lounge. What's it cost?" },
                { from: 'quotemax', text: "All new fittings, or swapping existing? Roof-space access?" },
                { from: 'customer', text: "All new. Roof access is easy." },
              ]}
              typing
              quote={{ amount: 890 }}
            />
          </div>
        </div>
      );
    }
    ReactDOM.createRoot(document.getElementById('root')).render(<Demo />);
  </script>
</body>
</html>
