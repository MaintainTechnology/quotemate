<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>QuoteMax — LinkedIn carousel</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
  :root{
    --ink-deep:#16120F; --ink:#1E1813; --ink-card:#2B2422; --ink-line:#3A322C;
    --accent:#FFC400; --accent-ink:#1C1812; --accent-soft:#FFD23D; --accent-press:#E6AC00;
    --text-pri:#F6F1EA; --text-sec:#C3B8AC; --text-dim:#A2968A; --edge-glow:#6E6354;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:#0b0908;font-family:'Manrope',sans-serif;display:flex;flex-direction:column;align-items:center;gap:40px;padding:40px 0}
  body.single{padding:0;gap:0}

  .slide{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--ink-deep);color:var(--text-pri);flex:0 0 auto;
    background-image:radial-gradient(58% 40% at 90% 4%, rgba(255,196,0,0.14), transparent 60%),radial-gradient(55% 40% at 8% -4%, rgba(110,99,84,0.22), transparent 60%);}

  /* photo compositing — DS duotone: desaturate+warm, multiply charcoal scrim, soft-light accent lift */
  .photo{position:absolute;inset:0;z-index:0;overflow:hidden}
  .photo img{width:100%;height:100%;object-fit:cover;filter:grayscale(.5) saturate(.72) contrast(1.06) brightness(.8) sepia(.22)}
  .photo::before{content:"";position:absolute;inset:0;background:var(--ink-deep);mix-blend-mode:multiply;opacity:.42}
  .photo::after{content:"";position:absolute;inset:0;background:var(--accent);mix-blend-mode:soft-light;opacity:.12}
  .scrim{position:absolute;inset:0;z-index:1}
  .scrim.top{background:linear-gradient(180deg, rgba(22,18,15,.95) 0%, rgba(22,18,15,.86) 24%, rgba(22,18,15,.46) 46%, rgba(22,18,15,.8) 72%, rgba(22,18,15,.95) 100%)}
  .scrim.left{background:linear-gradient(96deg, rgba(22,18,15,.96) 0%, rgba(22,18,15,.88) 40%, rgba(22,18,15,.34) 78%, rgba(22,18,15,.12) 100%)}
  .scrim.faint{background:linear-gradient(180deg, rgba(22,18,15,.93) 0%, rgba(22,18,15,.91) 100%)}
  .topo{position:absolute;right:-240px;bottom:-320px;width:1060px;height:1060px;opacity:0.09;z-index:0;pointer-events:none}

  .stage{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;padding:96px 96px 0}
  .brand{flex:0 0 auto;display:flex;align-items:center;gap:18px}
  .mark{width:58px;height:58px;flex:0 0 auto}
  .word{font-weight:800;font-size:33px;letter-spacing:-0.02em;text-transform:uppercase}
  .mid{flex:1 1 auto;display:flex;flex-direction:column;justify-content:center;min-height:0}

  .eyebrow{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:19px;letter-spacing:0.18em;text-transform:uppercase;color:var(--accent)}
  .eyebrow .dim{color:var(--text-dim)}
  .h{font-weight:800;line-height:0.98;letter-spacing:-0.035em;word-spacing:0.08em;text-transform:uppercase;color:var(--text-pri)}
  .h .hl{color:var(--accent)}

  .stack{margin-top:34px}
  .line{font-weight:800;font-size:92px;line-height:1.04;letter-spacing:-0.035em;text-transform:uppercase;display:block;white-space:nowrap}
  .num{color:var(--accent);font-family:'JetBrains Mono',monospace;font-weight:700;letter-spacing:-0.04em}
  .sub{margin-top:44px;max-width:840px;font-weight:700;font-size:33px;line-height:1.32;color:var(--text-sec)}
  .sub .hl{color:var(--accent);font-weight:800}
  .proof{margin-top:38px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:16px;letter-spacing:0.12em;text-transform:uppercase;color:var(--text-dim)}
  .proof .sep{color:var(--accent);opacity:0.85}

  .cards{margin-top:48px;display:flex;flex-direction:column;gap:20px}
  .card{background:rgba(43,36,34,0.82);border:1px solid var(--ink-line);box-shadow:inset 0 1px 0 0 rgba(255,255,255,0.06);padding:32px 36px;backdrop-filter:blur(2px)}
  .card__l{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:20px;letter-spacing:0.14em;text-transform:uppercase;color:var(--accent)}
  .card__b{margin-top:10px;font-weight:700;font-size:33px;letter-spacing:-0.01em;color:var(--text-pri)}

  .steps{margin-top:50px;display:flex;flex-direction:column}
  .step{display:flex;gap:40px;align-items:flex-start;padding:38px 0;border-top:1px solid var(--ink-line)}
  .step:last-child{border-bottom:1px solid var(--ink-line)}
  .step__n{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:62px;line-height:1;color:var(--accent);letter-spacing:-0.04em;flex:0 0 auto;width:118px}
  .step__t{font-weight:800;font-size:39px;letter-spacing:-0.02em;text-transform:uppercase;color:var(--text-pri)}
  .step__b{margin-top:8px;font-weight:500;font-size:28px;color:var(--text-sec)}

  .qmark{font-weight:800;font-size:200px;line-height:0.6;color:var(--accent);height:96px}
  .quote{margin-top:22px;font-weight:800;font-size:74px;line-height:1.03;letter-spacing:-0.03em;word-spacing:0.07em;text-transform:uppercase;color:var(--text-pri);max-width:760px}
  .quote .hl{color:var(--accent)}
  .attrib{margin-top:46px;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:23px;letter-spacing:0.06em;color:var(--text-sec)}
  .attrib .tok{color:var(--text-dim)}

  .btn{display:inline-flex;align-items:center;gap:14px;background:var(--accent);color:var(--accent-ink);font-weight:800;font-size:28px;text-transform:uppercase;letter-spacing:0.01em;padding:26px 46px;margin-top:50px}
  .cta-foot{margin-top:38px;font-family:'JetBrains Mono',monospace;font-weight:500;font-size:18px;letter-spacing:0.1em;text-transform:uppercase;color:var(--text-dim)}
  .cta-foot .sep{color:var(--accent);opacity:0.8}

  .foot{flex:0 0 auto}
  .rule{height:1px;background:var(--ink-line)}
  .marquee{height:90px;background:var(--accent);display:flex;align-items:center;white-space:nowrap;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:18px;letter-spacing:0.12em;text-transform:uppercase;color:var(--accent-ink);padding:0 96px;gap:22px;margin:0 -96px}
  .marquee .dot{opacity:0.5}
</style>
</head>
<body>
<div id="app"></div>
<script>
const MARK = `<svg class="mark" viewBox="0 0 58 58" xmlns="http://www.w3.org/2000/svg"><rect width="58" height="58" fill="#FFC400"/><path d="M13 14.5h31a3 3 0 0 1 3 3v17.5a3 3 0 0 1-3 3H26l-9 8v-8h-4a3 3 0 0 1-3-3v-17.5a3 3 0 0 1 3-3z" fill="#1C1812"/><path d="M21 26.5l5.4 5.4L38.5 20.5" stroke="#FFC400" stroke-width="4" stroke-linecap="square" fill="none"/></svg>`;
const GRAIN = `<svg class="grain" style="position:absolute;inset:0;opacity:.05;mix-blend-mode:soft-light;pointer-events:none;z-index:3" xmlns="http://www.w3.org/2000/svg"><filter id="n"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#n)"/></svg>`;
const TOPO = `<svg class="topo" viewBox="0 0 900 900" fill="none" stroke="#6E6354" stroke-width="1.5"><circle cx="450" cy="450" r="120"/><circle cx="450" cy="450" r="190"/><circle cx="450" cy="450" r="265"/><circle cx="450" cy="450" r="345"/><circle cx="450" cy="450" r="430" stroke="#FFC400" stroke-opacity="0.4"/></svg>`;
const brand = () => `<div class="brand">${MARK}<div class="word">QuoteMax</div></div>`;
const marquee = (items) => `<div class="foot"><div class="rule"></div><div class="marquee">${items.map(t=>`<span>${t}</span>`).join('<span class="dot">·</span>')}</div></div>`;
const photo = (p) => p ? `<div class="photo"><img src="${p.src}" style="object-position:${p.pos||'center'}"></div><div class="scrim ${p.scrim||'top'}"></div>` : TOPO;
const wrap = (s, inner) => `<div class="slide">${photo(s.photo)}<div class="stage">${brand()}<div class="mid">${inner}</div>${marquee(s.bar)}</div>${GRAIN}</div>`;
const hl = (s) => s.replace(/\{([^}]+)\}/g, '<span class="hl">$1</span>');
const eyebrow = (parts) => `<div class="eyebrow">${parts.join(' <span class="dim">·</span> ')}</div>`;

// ---- content: edit this array to regenerate every post ----
const SLIDES = [
  { type:'stat', photo:{src:'img/hero-main.jpg', pos:'center 28%', scrim:'top'},
    eyebrow:['AI QUOTING','BUILT FOR AUSTRALIAN TRADIES'],
    lines:[['<1 MIN','QUOTES'],['24/7','ANSWERED'],['$0','COMMISSION']],
    sub:'A customer texts your number. QuoteMax drafts the {quote} before they hang up.',
    proof:['ELECTRICAL · NSW','PLUMBING · QLD','SOLAR + ROOFING ROLLING OUT'],
    bar:['QUOTEMAX','YOU REVIEW, TWEAK, SEND','MAINTAIN.COM.AU'] },

  { type:'list', photo:{src:'img/tools-flatlay.jpg', pos:'center', scrim:'faint'},
    eyebrow:['WHY SPEED WINS'],
    h:'The job goes to whoever {quotes first}.',
    cards:[['SAME-DAY QUOTE','You are in the running.'],['NEXT-DAY QUOTE','They have already booked someone.'],['NO QUOTE','You never hear back.']],
    sub:'QuoteMax answers 24/7 and drafts the quote in {under a minute}.',
    bar:['QUOTEMAX','SPEED IS THE JOB','MAINTAIN.COM.AU'] },

  { type:'steps', photo:null,
    eyebrow:['HOW IT WORKS'],
    h:'Three steps. {under a minute}.',
    steps:[['01','CUSTOMER TEXTS YOUR NUMBER','QuoteMax asks the right questions.'],['02','IT DRAFTS THE QUOTE','Your pricing book. Good, Better, Best.'],['03','YOU REVIEW AND SEND','Tweak if you want. Send. Get paid.']],
    bar:['QUOTEMAX','YOUR PRICING BOOK, EVERY TIME','MAINTAIN.COM.AU'] },

  { type:'quote', photo:{src:'img/sparky-yellow.jpg', pos:'right 20%', scrim:'left'},
    eyebrow:['ON THE TOOLS','CLIENT QUOTE'],
    quote:'It quoted the job while I was still {on the ladder}.',
    attrib:['{name}','{trade} · {region}'],
    bar:['QUOTEMAX','REAL TRADIES, REAL JOBS','MAINTAIN.COM.AU'] },

  { type:'cta', photo:{src:'img/team-crew.jpg', pos:'center 36%', scrim:'top'},
    eyebrow:['GET STARTED'],
    h:'Get your own {QuoteMax} number.',
    sub:'Your dedicated line answers every customer and drafts the quote. You review, send, get paid.',
    btn:'Get my QuoteMax  →',
    foot:['$0 CUT OF YOUR JOBS','$99 SITE VISIT','CANCEL ANYTIME'],
    bar:['QUOTEMAX','DRAFTS YOUR QUOTE BEFORE THEY HANG UP','MAINTAIN.COM.AU'] },
];

function render(s){
  if(s.type==='stat') return wrap(s, `${eyebrow(s.eyebrow)}
    <div class="stack">${s.lines.map(([n,l])=>`<span class="line"><span class="num">${n.replace('<','&lt;')}</span> ${l}</span>`).join('')}</div>
    <div class="sub">${hl(s.sub)}</div>
    <div class="proof">${s.proof.map((p,i)=>`${i?'<span class="sep">›</span>':''}<span>${p}</span>`).join('')}</div>`);
  if(s.type==='list') return wrap(s, `${eyebrow(s.eyebrow)}
    <div class="h" style="font-size:80px;margin-top:28px;max-width:900px">${hl(s.h)}</div>
    <div class="cards">${s.cards.map(([l,b])=>`<div class="card"><div class="card__l">${l}</div><div class="card__b">${b}</div></div>`).join('')}</div>
    <div class="sub" style="margin-top:40px">${hl(s.sub)}</div>`);
  if(s.type==='steps') return wrap(s, `${eyebrow(s.eyebrow)}
    <div class="h" style="font-size:84px;margin-top:28px">${hl(s.h)}</div>
    <div class="steps">${s.steps.map(([n,t,b])=>`<div class="step"><div class="step__n">${n}</div><div><div class="step__t">${t}</div><div class="step__b">${b}</div></div></div>`).join('')}</div>`);
  if(s.type==='quote') return wrap(s, `${eyebrow(s.eyebrow)}
    <div class="qmark">&ldquo;</div>
    <div class="quote">${hl(s.quote)}</div>
    <div class="attrib">${s.attrib.map(a=>a.replace(/\{([^}]+)\}/g,'<span class="tok">$1</span>')).join(', ')}</div>`);
  if(s.type==='cta') return wrap(s, `${eyebrow(s.eyebrow)}
    <div class="h" style="font-size:90px;margin-top:28px;max-width:900px">${hl(s.h)}</div>
    <div class="sub" style="font-size:34px">${s.sub}</div>
    <div><span class="btn">${s.btn}</span></div>
    <div class="cta-foot">${s.foot.map((f,i)=>`${i?'<span class="sep">·</span> ':''}${f}`).join(' ')}</div>`);
}

const only = new URLSearchParams(location.search).get('slide');
if(only!==null){
  document.body.classList.add('single');
  document.getElementById('app').innerHTML = render(SLIDES[+only]);
  // The capture viewport may not be exactly 1080x1350 (fractional DPR); scale the slide to fill it (aspect ratios match).
  const sl=document.querySelector('.slide');
  sl.style.position='fixed'; sl.style.left='0'; sl.style.top='0';
  sl.style.transformOrigin='top left';
  sl.style.transform='scale('+(window.innerWidth/1080)+')';
  document.documentElement.style.overflow=document.body.style.overflow='hidden';
} else document.getElementById('app').innerHTML = SLIDES.map(render).join('');
</script>
</body>
</html>
