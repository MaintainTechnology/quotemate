  <rect x="0" y="0" width="1433" height="747" fill="#0b1220"/>
  <image x="0" y="0" width="1093" height="747" xlink:href="jon-roof-source.png" preserveAspectRatio="none"/>
  <rect x="1.5" y="1.5" width="1090" height="744" fill="none" stroke="#ffffff" stroke-opacity="0.32" stroke-width="3"/>

  <!-- Dark under-strokes keep every category legible on the pale metal roof. -->
  <g fill="none" stroke="#07101c" stroke-width="9" stroke-linecap="round" stroke-linejoin="round" opacity="0.86">
    <use xlink:href="#ridgeSolid"/>
    <use xlink:href="#ridgeDashed" stroke-dasharray="13 9"/>
    <use xlink:href="#hipSolid"/>
    <use xlink:href="#hipDashed" stroke-dasharray="13 9"/>
    <use xlink:href="#valleySolid"/>
    <use xlink:href="#valleyDashed" stroke-dasharray="13 9"/>
    <use xlink:href="#junctionDashed" stroke-dasharray="5 8"/>
    <use xlink:href="#eaveSolid"/>
    <use xlink:href="#eaveDashed" stroke-dasharray="13 9"/>
    <use xlink:href="#porticoRakes" stroke-dasharray="4 8"/>
  </g>

  <g fill="none" stroke-width="4.2" stroke-linecap="round" stroke-linejoin="round">
    <use xlink:href="#ridgeSolid" stroke="#ff375f"/>
    <use xlink:href="#ridgeDashed" stroke="#ff375f" stroke-dasharray="13 9"/>
    <use xlink:href="#hipSolid" stroke="#ff9f0a"/>
    <use xlink:href="#hipDashed" stroke="#ff9f0a" stroke-dasharray="13 9"/>
    <use xlink:href="#valleySolid" stroke="#0a84ff"/>
    <use xlink:href="#valleyDashed" stroke="#0a84ff" stroke-dasharray="13 9"/>
    <use xlink:href="#junctionDashed" stroke="#bf5af2" stroke-dasharray="5 8"/>
    <use xlink:href="#eaveSolid" stroke="#30d158"/>
    <use xlink:href="#eaveDashed" stroke="#30d158" stroke-dasharray="13 9"/>
    <use xlink:href="#porticoRakes" stroke="#d1d5db" stroke-width="3" stroke-dasharray="4 8"/>
  </g>

  <!-- Sidebar -->
  <rect x="1093" y="0" width="340" height="747" fill="#0b1220"/>
  <g font-family="Arial, Helvetica, sans-serif" fill="#f8fafc">
    <text x="1124" y="57" font-size="25" font-weight="700" letter-spacing="1.1">ROOF LINE TRACE</text>
    <text x="1124" y="83" font-size="14" fill="#94a3b8">Main connected roof · 1093 × 747 px</text>

    <text x="1124" y="132" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.5">LEGEND</text>

    <line x1="1125" y1="166" x2="1182" y2="166" stroke="#07101c" stroke-width="9" stroke-linecap="round"/>
    <line x1="1125" y1="166" x2="1182" y2="166" stroke="#ff375f" stroke-width="4.2" stroke-linecap="round"/>
    <text x="1200" y="171" font-size="17" font-weight="700">RIDGE</text>

    <line x1="1125" y1="206" x2="1182" y2="206" stroke="#07101c" stroke-width="9" stroke-linecap="round"/>
    <line x1="1125" y1="206" x2="1182" y2="206" stroke="#ff9f0a" stroke-width="4.2" stroke-linecap="round"/>
    <text x="1200" y="211" font-size="17" font-weight="700">HIP</text>

    <line x1="1125" y1="246" x2="1182" y2="246" stroke="#07101c" stroke-width="9" stroke-linecap="round"/>
    <line x1="1125" y1="246" x2="1182" y2="246" stroke="#0a84ff" stroke-width="4.2" stroke-linecap="round"/>
    <text x="1200" y="251" font-size="17" font-weight="700">VALLEY / BOX GUTTER</text>

    <line x1="1125" y1="286" x2="1182" y2="286" stroke="#07101c" stroke-width="9" stroke-linecap="round"/>
    <line x1="1125" y1="286" x2="1182" y2="286" stroke="#30d158" stroke-width="4.2" stroke-linecap="round"/>
    <text x="1200" y="291" font-size="17" font-weight="700">EAVE / GUTTER EDGE</text>

    <line x1="1125" y1="326" x2="1182" y2="326" stroke="#07101c" stroke-width="9" stroke-linecap="round" stroke-dasharray="5 8"/>
    <line x1="1125" y1="326" x2="1182" y2="326" stroke="#bf5af2" stroke-width="4.2" stroke-linecap="round" stroke-dasharray="5 8"/>
    <text x="1200" y="331" font-size="17" font-weight="700">UNRESOLVED JUNCTION</text>

    <rect x="1118" y="371" width="290" height="116" rx="12" fill="#111c2f" stroke="#334155"/>
    <text x="1138" y="402" font-size="15" font-weight="700">LINE CONFIDENCE</text>
    <line x1="1139" y1="430" x2="1190" y2="430" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round"/>
    <text x="1204" y="435" font-size="14" fill="#cbd5e1">Solid: visible / supported</text>
    <line x1="1139" y1="461" x2="1190" y2="461" stroke="#cbd5e1" stroke-width="4" stroke-linecap="round" stroke-dasharray="11 8"/>
    <text x="1204" y="466" font-size="14" fill="#cbd5e1">Dashed: inferred / ambiguous</text>

    <text x="1124" y="531" font-size="12" font-weight="700" fill="#64748b" letter-spacing="1.5">ACCURACY NOTES</text>
    <text x="1124" y="564" font-size="14" fill="#cbd5e1">
      <tspan x="1124" dy="0">Visible seams align to roughly</tspan>
      <tspan x="1124" dy="21">±2–4 source pixels.</tspan>
      <tspan x="1124" dy="29">Tree, glare, map label and</tspan>
      <tspan x="1124" dy="21">dormer occlusion widen this to</tspan>
      <tspan x="1124" dy="21">about ±8–15 pixels.</tspan>
    </text>

    <rect x="1118" y="662" width="290" height="58" rx="10" fill="#2a1720" stroke="#7f1d1d"/>
    <text x="1138" y="686" font-size="13" font-weight="700" fill="#fecaca">VISUAL TRACE — NOT SURVEY DATA</text>
    <text x="1138" y="706" font-size="12" fill="#fca5a5">Detached shed/carport excluded.</text>
  </g>
</svg>
