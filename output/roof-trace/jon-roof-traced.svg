<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" width="1433" height="747" viewBox="0 0 1433 747">
  <title>Roof line trace for jon-roof.png</title>
  <desc>Pixel-aligned trace of visible ridges, hips, valleys, and eaves. Dashed lines identify inferred or structurally ambiguous continuations.</desc>

  <defs>
    <filter id="panelShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="7" flood-color="#000000" flood-opacity="0.38"/>
    </filter>

    <g id="ridgeSolid">
      <path d="M316 169 L296 300"/>
      <path d="M296 300 L527 353"/>
      <path d="M438 407 L414 568"/>
      <path d="M541 438 L625 439"/>
      <path d="M512 560 L497 644"/>
