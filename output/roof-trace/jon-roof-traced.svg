    </g>

    <g id="valleyDashed">
      <path d="M527 353 L541 438"/>
    </g>

    <g id="junctionDashed">
      <path d="M626 242 L527 353"/>
    </g>

    <g id="eaveSolid">
      <path d="M425 94 L744 143 L713 372 L610 377"/>
      <path d="M231 334 L250 382 L438 407"/>
      <path d="M610 377 L695 386 L669 494 L621 489"/>
      <path d="M405 438 L361 599 L469 617"/>
      <path d="M621 492 L671 501 L637 649 L548 632 L552 594 L610 604 L621 492"/>
      <path d="M469 579 L462 642"/>
