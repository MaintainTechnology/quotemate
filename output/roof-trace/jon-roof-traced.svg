      <path d="M626 242 L610 377"/>
      <path d="M438 407 L405 438"/>
      <path d="M414 568 L361 599"/>
      <path d="M414 568 L469 580"/>
      <path d="M541 438 L610 377"/>
      <path d="M541 438 L414 568"/>
