<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { width: 1920px; height: 1080px; overflow: hidden; }

    background: #0E1622;

    display: flex;

  .rule { position: absolute; left: 160px; right: 160px; height: 1px; background: rgba(255,255,255,0.14); }

  .kicker {

  h1 {
    font-weight: 800; font-size: 104px; line-height: 1.02;
    letter-spacing: -0.01em; text-transform: uppercase; margin-bottom: 64px;
  }
  h1 .accent { color: #FF5A1F; }
  ul { list-style: none; display: grid; grid-template-columns: 1fr 1fr; gap: 28px 64px; max-width: 1280px; }
  li { display: flex; align-items: center; gap: 22px; font-size: 38px; font-weight: 700; color: rgba(255,255,255,0.92); }
  li svg { flex: none; }
  .foot {
    position: absolute; left: 160px; right: 160px; bottom: 40px;
    display: flex; align-items: center; justify-content: space-between;
  }
  .foot .brand { font-family: 'JetBrains Mono', monospace; font-size: 20px; letter-spacing: 0.22em; text-transform: uppercase; color: rgba(255,255,255,0.55); }
  .powered { display: flex; align-items: center; gap: 12px; font-size: 18px; color: rgba(255,255,255,0.45); font-weight: 500; }
  .powered img { width: 28px; height: 28px; display: block; }

</head>
