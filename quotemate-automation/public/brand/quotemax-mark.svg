<svg xmlns="http://www.w3.org/2000/svg" width="699" height="699" viewBox="0 0 699 699" role="img" aria-label="QuoteMax">
  <title>QuoteMax</title>
  <!-- QuoteMax favicon: the quote-max-logo-4 colourway (charcoal body, yellow
       notch) from redesign/DesignSystem/assets/logos/.
       That artwork is drawn for a LIGHT ground, so the tile is the app's warm
       paper #FAF8F4 rather than the accent yellow — on a yellow tile the yellow
       notch would disappear into the background.
       The tile is deliberate: a transparent favicon goes invisible against one
       browser theme or the other, and tabs expose no theme variable to react to.
       Yellow is the canonical #FFC400, not the source art's #E3C13C.
       The mark is 397x270 centred on the 699 canvas; the 1.3x scale about the
       centre lifts it to ~74% tile width so it still reads at 16px.
       Single source of truth - favicon.ico, apple-icon.png and the icon PNGs are
       all derived from this file by scripts/build-brand-assets.mjs. -->
  <rect width="699" height="699" fill="#FAF8F4"/>
