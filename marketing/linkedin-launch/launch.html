<!doctype html>
<html lang="en-AU">
<head>
<meta charset="utf-8">
<title>QuoteMax launch deck, 20 slides</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<style>
/* ════════════════════════════════════════════════════════════════════
   THE LAUNCH DECK, 20 slides
   A swipeable LinkedIn document announcing that QuoteMax is publicly live.
   Read in order: intro, the problem, how it works, your trade, the numbers,
   the close. Four section dividers carry the reader through it.

   THE SIGNATURE is the wireframe terrain band. The reference posts put big
   type up top and a glowing wireframe mountain range along the bottom edge;
   the plates in gfx/ are the QuoteMax equivalent of exactly that, so the band
   runs along the foot of every content slide and goes full bleed on the
   covers and dividers. It is what makes 20 slides read as one deck.

   BRAND, from DESIGN.md at the repo root:
     canvas #16120F, ONE accent #FFC400, text on yellow is #1C1812 never white,
     Manrope 800 all-caps display, JetBrains Mono labels, square corners,
     hairlines instead of shadows, Australian English, no emoji, no em dashes.
   ════════════════════════════════════════════════════════════════════ */
:root{
  --canvas:#16120F; --card:#2B2422; --hair:#3A322C; --hair-hi:#4A4036;
  --accent:#FFC400; --ink-on-accent:#1C1812;
  --pri:#F6F1EA; --sec:#C3B8AC; --dim:#A2968A;
  --M:92px; --head:142px; --tick:8px;
}
*{margin:0;padding:0;box-sizing:border-box}
body{background:#0a0908;font-family:'Manrope',sans-serif;display:flex;flex-direction:column;align-items:center;gap:46px;padding:46px 0}
body.one{padding:0;gap:0}
.s{position:relative;width:1080px;height:1350px;overflow:hidden;background:var(--canvas);color:var(--pri);flex:0 0 auto}
.grain{position:absolute;inset:0;z-index:9;pointer-events:none;opacity:.05;mix-blend-mode:soft-light}

/* ── plates and photography ────────────────────────────────────────
   The wireframe plates are already on-brand, so they take almost no tint,
   only a touch of warmth. Photography gets a light desaturation so a stock
   shot sits with the palette, never enough to hide the tradie. */
.im{position:absolute;overflow:hidden;z-index:0}
.im img{width:100%;height:100%;object-fit:cover;display:block}
.im.plate img{filter:saturate(1.06) contrast(1.04) brightness(1.0)}
.im.photo img{filter:grayscale(.12) saturate(.96) contrast(1.05) brightness(1.03) sepia(.08)}
.im.photo::after{content:"";position:absolute;inset:0;background:var(--accent);mix-blend-mode:soft-light;opacity:.12}

/* The band. Masked at the top so the terrain dissolves into the canvas
   instead of ending on a hard seam, which is the whole trick. */
.band{position:absolute;left:0;right:0;bottom:var(--tick);height:430px;z-index:0}
.band .im{inset:0}
.band::after{content:"";position:absolute;inset:0;
  background:linear-gradient(180deg,var(--canvas) 0%,rgba(22,18,15,.72) 26%,rgba(22,18,15,.12) 62%,transparent 100%)}
.band.tall{height:600px}

/* Full-bleed treatment for covers and dividers. */
.bleed{position:absolute;inset:0;z-index:0}
.bleed .im{inset:0}
.bleed .sc{position:absolute;inset:0;
  background:linear-gradient(180deg,rgba(22,18,15,.90) 0%,rgba(22,18,15,.72) 30%,rgba(22,18,15,.52) 54%,rgba(22,18,15,.80) 82%,rgba(22,18,15,.94) 100%)}
.bleed .sc.hard{background:linear-gradient(180deg,rgba(22,18,15,.94) 0%,rgba(22,18,15,.86) 34%,rgba(22,18,15,.66) 60%,rgba(22,18,15,.88) 100%)}

/* ── chrome ───────────────────────────────────────────────────────── */
.rail{position:absolute;top:0;left:0;right:0;height:var(--head);z-index:6;
  display:flex;align-items:center;justify-content:space-between;padding:0 var(--M)}
.rail img{height:50px;width:auto;display:block}
.count{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px;letter-spacing:.18em;color:var(--dim)}
.count b{color:var(--accent)}
/* Carousel progress, the one piece of chrome that says "keep swiping". */
.tick{position:absolute;left:0;bottom:0;height:var(--tick);z-index:7;background:var(--accent)}
.tickbg{position:absolute;left:0;right:0;bottom:0;height:var(--tick);z-index:6;background:#241E1B}

.zone{position:absolute;left:0;right:0;top:var(--head);bottom:var(--tick);z-index:5;
  padding:0 var(--M);display:flex;flex-direction:column;justify-content:center}
.zone.low{justify-content:flex-start;padding-top:24px}
.zone.flush{padding:0}
.kick{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:17px;letter-spacing:.22em;text-transform:uppercase;color:var(--accent)}
.kick i{color:var(--dim);font-style:normal;font-weight:500}
.h{font-weight:800;text-transform:uppercase;letter-spacing:-.036em;line-height:.96;color:var(--pri)}
.h em{color:var(--accent);font-style:normal}
.p{font-weight:500;line-height:1.36;color:var(--sec)}
.p em{color:var(--pri);font-weight:700;font-style:normal}
.p b{color:var(--accent);font-weight:800}

/* split: type in a left column, photography as a real column on the right with
   a hairline between them. This is the layout carried over from the docket
   posts, and it beats a full-bleed photo with type on top for one reason: the
   tradie is never dimmed to make room for words. Each side gets its own space. */
.split{position:absolute;inset:0;display:flex;z-index:5}
.split .l{flex:0 0 560px;padding:0 44px 0 var(--M);display:flex;flex-direction:column;justify-content:center}
.split .r{flex:1 1 auto;position:relative;border-left:1px solid var(--hair);overflow:hidden}
.split .r .im{inset:0}

/* cover: the lockup is the hero, so it runs large and centred */
.cover{text-align:left}
.cover .lock{height:104px;width:auto;display:block}
.live{display:inline-flex;align-items:center;gap:12px;margin-top:44px;padding:12px 22px;border:1px solid var(--accent);
  font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
.live span{width:9px;height:9px;background:var(--accent);display:block}

/* section divider: an oversized numeral doing the work */
.sec .no{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:250px;line-height:.8;letter-spacing:-.06em;color:var(--accent);opacity:.9}
.sec .of{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:19px;letter-spacing:.2em;text-transform:uppercase;color:var(--dim);margin-top:18px}

/* grid: bordered cards, hairlines, no side stripes */
.grid{display:grid;gap:18px;margin-top:44px}
.grid.two{grid-template-columns:1fr 1fr}
.cell{border:1px solid var(--hair);background:rgba(43,36,34,.80);padding:28px 30px;
  box-shadow:inset 0 1px 0 0 rgba(255,255,255,.06)}
.cell .l{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px;letter-spacing:.15em;text-transform:uppercase;color:var(--accent)}
.cell .b{margin-top:10px;font-weight:700;font-size:27px;line-height:1.2;color:var(--pri)}
.cell .b small{display:block;margin-top:8px;font-weight:500;font-size:21px;line-height:1.3;color:var(--sec)}

/* steps: a numeral in a bordered tile, on a spine */
.steps{margin-top:40px;position:relative}
.steps::before{content:"";position:absolute;left:35px;top:24px;bottom:24px;width:1px;background:var(--hair)}
.steps>div{display:flex;gap:32px;align-items:flex-start;padding:20px 0}
.steps .n{position:relative;z-index:1;flex:0 0 auto;width:70px;height:70px;display:grid;place-items:center;background:var(--canvas);
  border:1px solid var(--accent);font-family:'JetBrains Mono',monospace;font-weight:700;font-size:26px;color:var(--accent)}
.steps .t{font-weight:800;font-size:31px;letter-spacing:-.02em;text-transform:uppercase;line-height:1.06}
.steps .d{margin-top:6px;font-weight:500;font-size:23px;line-height:1.3;color:var(--sec)}

/* stats: ruled rows, figure set right */
.stats{margin-top:46px;border-top:1px solid var(--hair)}
.stats>div{display:flex;align-items:baseline;justify-content:space-between;gap:28px;padding:26px 0;border-bottom:1px solid var(--hair)}
.stats .k{font-family:'JetBrains Mono',monospace;font-weight:500;font-size:18px;letter-spacing:.14em;text-transform:uppercase;color:var(--dim);max-width:440px}
.stats .v{font-family:'JetBrains Mono',monospace;font-weight:700;font-size:68px;line-height:.9;letter-spacing:-.05em;word-spacing:-.16em;color:var(--accent);white-space:nowrap}

/* the yellow action block, dark ink only */
.cta{display:inline-flex;align-items:center;gap:14px;margin-top:42px;padding:24px 42px;background:var(--accent);
  color:var(--ink-on-accent);font-weight:800;font-size:26px;text-transform:uppercase}
.terms{margin-top:28px;display:flex;flex-wrap:wrap;gap:8px 16px;
  font-family:'JetBrains Mono',monospace;font-weight:500;font-size:16px;letter-spacing:.13em;text-transform:uppercase;color:var(--dim)}
.terms b{color:var(--accent)}
.swipe{margin-top:36px;font-family:'JetBrains Mono',monospace;font-weight:700;font-size:16px;letter-spacing:.2em;text-transform:uppercase;color:var(--accent)}
</style>
</head>
<body>
<div id="app"></div>
<script>
const LOGO = 'logo/quote-max-logo-dark.svg';
const GRAIN = `<svg class="grain" xmlns="http://www.w3.org/2000/svg"><filter id="g"><feTurbulence type="fractalNoise" baseFrequency="0.86" numOctaves="2" stitchTiles="stitch"/></filter><rect width="100%" height="100%" filter="url(#g)"/></svg>`;
const hl = (s) => String(s).replace(/\{([^}]+)\}/g, '<em>$1</em>');
const kick = (parts) => `<div class="kick">${parts.map((p,i)=>i?`<i>&nbsp;&middot;&nbsp;</i>${p}`:p).join('')}</div>`;
const img = (src, cls, pos) => `<div class="im ${cls}"><img src="${src}" style="object-position:${pos||'center'}"></div>`;
const band = (g, tall) => `<div class="band${tall?' tall':''}">${img('gfx/'+g[0]+'.jpg','plate',g[1])}</div>`;
const bleed = (src, cls, pos, hard) => `<div class="bleed">${img(src,cls,pos)}<div class="sc${hard?' hard':''}"></div></div>`;

let TOTAL = 0;
function shell(S, inner, opts = {}) {
  const pct = Math.round((S.n / TOTAL) * 1000) / 10;
  return `<div class="s">
    ${opts.behind || ''}
    <div class="rail"><img src="${LOGO}" alt=""><div class="count"><b>${String(S.n).padStart(2,'0')}</b> / ${TOTAL}</div></div>
    <div class="zone${opts.low ? ' low' : ''}${opts.flush ? ' flush' : ''}">${inner}</div>
    <div class="tickbg"></div><div class="tick" style="width:${pct}%"></div>
    ${GRAIN}
  </div>`;
}

const L = {
  // 01 the cover. The lockup is the message: we exist, and we are live.
  cover: (S) => shell(S, `
    <div class="cover">
      <img class="lock" src="${LOGO}" alt="QuoteMax">
      <div class="live"><span></span>Now live in Australia</div>
      <div class="h" style="margin-top:52px;font-size:82px;max-width:900px">${hl(S.head)}</div>
      <div class="p" style="margin-top:30px;font-size:29px;max-width:800px">${hl(S.copy)}</div>
      <div class="swipe">Swipe &rarr;</div>
    </div>`,
    { behind: bleed('gfx/terrain-horizon.jpg','plate','center 62%') }),

  // section divider. One oversized numeral, one line.
  section: (S) => shell(S, `
    <div class="sec">
      ${kick([S.kick])}
      <div class="no" style="margin-top:26px">${String(S.part).padStart(2,'0')}</div>
      <div class="of">Part ${S.part} of 4</div>
      <div class="h" style="margin-top:34px;font-size:74px;max-width:860px">${hl(S.head)}</div>
      <div class="p" style="margin-top:26px;font-size:27px;max-width:780px">${hl(S.copy)}</div>
    </div>`,
    { behind: bleed('gfx/'+S.plate[0]+'.jpg','plate',S.plate[1],true) }),

  // big type over flat charcoal, terrain along the foot. The reference look.
  bigtype: (S) => shell(S, `
    ${kick(S.kick)}
    <div class="h" style="margin-top:28px;font-size:${S.hsize||88}px;max-width:900px">${hl(S.head)}</div>
    <div class="p" style="margin-top:34px;font-size:29px;max-width:820px">${hl(S.copy)}</div>`,
    { behind: band(S.plate, true) }),

  // photography as a column, not a backdrop. The type keeps its own dark
  // ground, so nothing has to be dimmed for the words to be legible.
  photo: (S) => shell(S, `
    <div class="split">
      <div class="l">
        ${kick(S.kick)}
        <div class="h" style="margin-top:24px;font-size:${S.hsize||54}px">${hl(S.head)}</div>
        <div class="p" style="margin-top:24px;font-size:25px">${hl(S.copy)}</div>
        ${S.tags ? `<div class="terms">${S.tags.map((t,i)=>`${i?'<b>&middot;</b>':''}<span>${t}</span>`).join('')}</div>` : ''}
      </div>
      <div class="r">${img('img/'+S.pic[0]+'.jpg','photo',S.pic[1])}</div>
    </div>`,
    { flush: true }),

  // bordered cards, two up
  grid: (S) => shell(S, `
    ${kick(S.kick)}
    <div class="h" style="margin-top:24px;font-size:${S.hsize||62}px;max-width:880px">${hl(S.head)}</div>
    <div class="grid two">${S.cells.map(([l,b,sm])=>`<div class="cell"><div class="l">${l}</div><div class="b">${b}${sm?`<small>${sm}</small>`:''}</div></div>`).join('')}</div>
    ${S.note?`<div class="p" style="margin-top:34px;font-size:26px;max-width:820px">${hl(S.note)}</div>`:''}`,
    { behind: band(S.plate) }),

  // a real sequence
  steps: (S) => shell(S, `
    ${kick(S.kick)}
    <div class="h" style="margin-top:24px;font-size:${S.hsize||62}px;max-width:860px">${hl(S.head)}</div>
    <div class="steps">${S.steps.map(([n,t,d])=>`<div><div class="n">${n}</div><div><div class="t">${t}</div><div class="d">${d}</div></div></div>`).join('')}</div>`,
    { behind: band(S.plate) }),

  // ruled figures
  stats: (S) => shell(S, `
    ${kick(S.kick)}
    <div class="h" style="margin-top:24px;font-size:${S.hsize||62}px;max-width:880px">${hl(S.head)}</div>
    <div class="stats">${S.rows.map(([k,v])=>`<div><span class="k">${k}</span><span class="v">${v}</span></div>`).join('')}</div>
    ${S.note?`<div class="p" style="margin-top:32px;font-size:26px;max-width:820px">${hl(S.note)}</div>`:''}`,
    { behind: band(S.plate) }),

  // the close
  close: (S) => shell(S, `
    ${kick(S.kick)}
    <div class="h" style="margin-top:26px;font-size:78px;max-width:880px">${hl(S.head)}</div>
    <div class="p" style="margin-top:28px;font-size:28px;max-width:800px">${hl(S.copy)}</div>
    <div><span class="cta">${S.cta}</span></div>
    <div class="terms">${S.terms.map((t,i)=>`${i?'<b>&middot;</b>':''}<span>${t}</span>`).join('')}</div>`,
    { behind: bleed('gfx/mesh-peaks.jpg','plate','center 58%') }),
};

/* ════════════════════════════════════════════════════════════════════
   CONTENT. Every figure is a real product fact: under a minute, 24/7, $0
   commission, $99 site visit credited back, from $49/mo, 14-day trial on
   Starter Monthly, about three minutes to set up, eight live trades, three
   channels. Nothing invented. No testimonials, because there are no
   consented ones to quote yet.
   ════════════════════════════════════════════════════════════════════ */
const SLIDES = [

// ── PART 01, THE PROBLEM ──────────────────────────────────────────
{ n:4, kind:'section', part:1, plate:['peaks-wire','center 66%'],
  kick:'THE PROBLEM',
  head:'Quoting is the bottleneck. {Not the work}.',
  copy:'Nobody got into a trade to type quotes at the kitchen table. Here is what it actually costs.' },

{ n:5, kind:'bigtype', plate:['wire-site-a','center 76%'],

         ['02','LOAD YOUR PRICING BOOK','Your rates, your assemblies, your call-out minimum.'],

];

TOTAL = SLIDES.length;
const render = (S) => L[S.kind](S);
const q = new URLSearchParams(location.search).get('slide');
if (q !== null) {
  document.body.classList.add('one');
  document.getElementById('app').innerHTML = render(SLIDES[+q]);
  const el = document.querySelector('.s');
  el.style.position='fixed'; el.style.left='0'; el.style.top='0';
  el.style.transformOrigin='top left';
  el.style.transform='scale('+(window.innerWidth/1080)+')';
